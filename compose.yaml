services:
  gdash:
    build: .
    # Host networking lets GDash find Cast devices with mDNS, which does
    # not cross Docker's bridge network.
    network_mode: host
    # Location, news feeds and calendars are set under Settings in the web
    # interface.
    environment:
      # The time zone for "today" in the calendar and for times without a zone.
      TZ: "Europe/Amsterdam"
      # Optional: the app ID of an own registered receiver, see
      # docs/receiver.md. Without it GDash uses the public DashCast receiver.
      # GDASH_CAST_APP_ID: "ABCD1234"
    volumes:
      - gdash-data:/data
    restart: unless-stopped

    # Hardening: GDash needs no root, no capabilities and writes only to
    # /data. A data folder you mount yourself must belong to this user, see
    # "Data directory permissions" in docs/install.md.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # SQLite may spill a large sort to a temporary file.
    tmpfs:
      - /tmp

volumes:
  gdash-data:
