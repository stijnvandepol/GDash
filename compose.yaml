services:
  nookboard:
    build: .
    # Host networking lets Nookboard find Cast devices with mDNS, which does
    # not cross Docker's bridge network.
    network_mode: host
    # Location, news feeds and calendars are set under Settings in the web
    # interface.
    environment:
      # The time zone for "today" in the calendar and for times without a zone.
      TZ: "Europe/Amsterdam"
      # Optional: the app ID of an own registered receiver, see
      # docs/receiver.md. Without it Nookboard uses the public DashCast receiver.
      # NOOKBOARD_CAST_APP_ID: "ABCD1234"
    volumes:
      - nookboard-data:/data
    restart: unless-stopped

volumes:
  nookboard-data:
