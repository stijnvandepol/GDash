# Builds a release when a version tag such as v1.0.0 is pushed: archives
# for Linux and Windows with SHA256SUMS and a CycloneDX SBOM as a draft
# GitHub release, and a Docker image for amd64 and arm64 on GitHub's
# container registry with an SBOM of its own. The release stays a draft until
# someone publishes it. Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For the provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before npm ci, so it lists what go.mod and package-lock.json pin and
      # not every file of node_modules.
      - name: SBOM of the pinned dependencies
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Web interface
        working-directory: web
        run: npm ci && npm run build
      - name: Archives
        run: |
          scripts/build-release.sh "$GITHUB_REF_NAME"
          cp "$RUNNER_TEMP/sbom.cdx.json" "dist-release/gdash_${GITHUB_REF_NAME#v}_sbom.cdx.json"
      # Signed statement of which commit and workflow built these files,
      # checked with: gh attestation verify <file> --repo <owner>/gdash
      # GitHub offers attestations for private repositories on paid plans
      # only, so this runs once the repository is public.
      - name: Attest provenance of the archives
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.tar.gz
            dist-release/*.zip
            dist-release/SHA256SUMS
            dist-release/*.cdx.json
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist-release/* --draft $prerelease \
            --title "GDash $GITHUB_REF_NAME" --generate-notes

  image:
    # The archives job checks the version format first; a tag such as
    # "vnext" must not push an image or move "latest".
    needs: archives
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # For the provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:${GITHUB_REF_NAME#v}"
          # Only a final release moves "latest"; a pre-release does not.
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then tags="$tags,$image:latest"; fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          # BuildKit attaches its own provenance (the Dockerfile, build
          # arguments and base image digests) to the image in the registry.
          provenance: mode=max
      # The packages of the image itself: the Go modules in the binary and
      # the base image's. Syft reads the linux/amd64 image; the arm64 one is
      # built from the same sources and base.
      - name: SBOM of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: gdash-image.cdx.json
          artifact-name: gdash-image.cdx.json
          upload-release-assets: false
      # Like the archives: signed provenance stored next to the image, checked
      # with: gh attestation verify oci://<image> --repo <owner>/gdash
      - name: Attest provenance of the image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
