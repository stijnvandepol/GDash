# Builds a release when a version tag such as v1.0.0 is pushed: archives
# for Linux and Windows with SHA256SUMS as a draft GitHub release, and a
# Docker image for amd64 and arm64 on GitHub's container registry. The
# release stays a draft until someone publishes it. Actions are pinned to
# commit SHAs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Web interface
        working-directory: web
        run: npm ci && npm run build
      - name: Archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist-release/* --draft $prerelease \
            --title "GDash $GITHUB_REF_NAME" --generate-notes

  image:
    # The archives job checks the version format first; a tag such as
    # "vnext" must not push an image or move "latest".
    needs: archives
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:${GITHUB_REF_NAME#v}"
          # Only a final release moves "latest"; a pre-release does not.
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
