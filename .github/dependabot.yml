# Weekly update proposals for everything that is pinned: Go modules, npm
# packages, GitHub Actions (pinned by commit SHA, with the version in a
# comment) and the base images of the Dockerfile (pinned by digest). Minor
# and patch updates arrive as one pull request per ecosystem; a major update
# is its own pull request, as it may need code changes. CI runs on each.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the compiler rewritten in Go; svelte-check does not
      # run on it yet. Lift this once Svelte's tooling supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The build stays on a Node.js LTS line; odd majors such as 25 are
      # never LTS. Move to the next even major by hand once it is LTS.
      - dependency-name: node
        update-types: [version-update:semver-major]
